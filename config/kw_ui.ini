# UI settings. Restart after editing. Booleans use true/false.
# Black strip follows each message's actual text width.
# Opacity: 0 transparent, 100 opaque.
match_chat_background=true
match_chat_background_opacity=35

# Font multiplier: 1.15 = +15%, 1.25 = +25%; supported 0.50..2.00.
match_chat_outline=true
match_chat_font_scale=1.35

# R,G,B channels (0..255). Light outline for dark player text, dark for bright.
match_chat_outline_light_rgb=160,160,160
match_chat_outline_dark_rgb=30,30,30

# Shared font-size ceiling/title correction for high resolutions.
font_resolution_scaling=true

# Fix list scrolling/navigation when high-resolution text exceeds 32767 pixels
# of content (including 8K and higher). Applies consistent 32-bit coordinates.
# Also grows only the LAN-room map list using the stock storage allocator.
# Capacity: 999..32767 entries; default 4096. Larger existing lists are retained.
# Set the fix to false to restore stock coordinate handling and capacity.
map_list_high_resolution_fix=true
map_list_capacity=4096

# Main-menu animation, restart required:
# stock = original animation; no main-menu animation patch.
# fast = approximately 0.5 s reveal + 0.5 s menu entries (1 s total).
# off = skip startup reveal and menu-entry animation.
mainmenu_animation=fast

# In-match Esc-menu animation (independent of the main menu; restart required):
# stock = original opening/closing timing.
# fast = ~0.5 s TOTAL opening: ~0.1 s box/stage + ~0.4 s buttons; default.
# Fast keeps stock closing/press cadence so button actions finish before close.
# off = collapse opening/closing into a few UI ticks.
# Hover keeps stock timing; off also shortens press/out with callback ordering.
ingame_menu_animation=fast

# AA slider, restart required:
# auto = on capable D3D9 hardware: Off, FXAA, then supported 2x/4x/8x MSAA.
# The device's colour/depth formats and shader capabilities are checked.
# stock = original driver-defined NONMASKABLE quality levels.
# Existing enabled values below 4 migrate to FXAA; higher values to at most 4x.
# Off stays Off. The chosen mode is saved per profile as KWPatchAntiAliasing.
antialiasing_modes=auto

# VP6 cutscenes, independent of Low/Custom rendering settings; restart required:
# auto = retain every source frame on a capable shader/texture device.
# full = explicitly retain every source frame; stock = original preset logic.
# This restores source cadence, not higher-resolution or interpolated videos.
video_playback=auto
